<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VEXO Coin · Sign in</title><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/login.css"></head>
<body><main class="auth-shell"><section class="auth-card"><a class="brand" href="index.html">V<b>EXO</b></a><div class="eyebrow">PLAYER ACCESS</div><h1>Welcome to <span class="grad">VEXO Coin.</span></h1><p class="muted">Sign in or create your VEXO account to continue.</p>
<form id="loginForm"><label class="field">Account type<select id="mode"><option value="signin">Sign in</option><option value="signup">Create account</option></select></label><label class="field">Display name<input id="username" maxlength="24" placeholder="Your display name"></label><label class="field">Email<input id="email" type="email" required autocomplete="email"></label><label class="field">Password<input id="password" type="password" minlength="8" required autocomplete="current-password"></label><label class="field">Confirm password<input id="confirm" type="password" minlength="8"></label><div class="auth-actions"><button class="btn primary" type="submit">Continue securely</button><button class="btn" type="button" id="google">Continue with Google</button></div></form>
<p id="message" class="notice" aria-live="polite"></p><p class="muted">Authentication is handled by Firebase. Never share your password, wallet recovery phrase, or private key.</p></section></main><script type="module" src="js/auth.js"></script></body></html>
